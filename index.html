<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
  </head>
  <body>
    <!-- Zeichenflaeche fuer das Glas. Liegt ueber dem Inhalt, unter den
         Knoepfen, und nimmt keine Klicks an. -->
    <canvas id="glasslayer"></canvas>

    <!-- Ziehbereich fuer das rahmenlose Fenster. -->
    <div id="titlebar" data-tauri-drag-region></div>

    <div id="wincontrols" class="glass row">
      <button id="w-min" class="ico sm" title="Minimieren"></button>
      <button id="w-max" class="ico sm" title="Maximieren"></button>
      <button id="w-close" class="ico sm danger" title="Schließen"></button>
    </div>

    <main id="home"><div id="grid"></div></main>

    <section id="reader" hidden>
      <div id="container"><div id="viewer" class="pdfViewer"></div></div>

      <button id="b-home" class="ico glass solo" title="Bibliothek"></button>

      <button id="b-find" class="ico glass solo" title="Suchen · Strg+F"></button>
      <button id="b-invert" class="ico glass solo" title="Invertieren · Strg+I"></button>

      <div id="pagechip" class="glass"></div>

      <button id="b-save" class="ico glass solo" title="Sichern · Strg+S" hidden></button>

      <div id="ann" class="glass row">
        <button id="a-toggle" class="ico" title="Markieren und Zeichnen"></button>
        <span id="ann-more">
          <button id="t-mark" class="ico" title="Marker · M"></button>
          <button id="t-ink" class="ico" title="Stift · Z"></button>
          <button id="t-text" class="ico" title="Textfeld · T"></button>
          <label id="swatch" title="Farbe"><input id="color" type="color" value="#ffd23f" /></label>
        </span>
      </div>

      <div id="findbar" class="glass row" hidden>
        <input id="find-q" type="text" spellcheck="false" autocomplete="off" />
        <span id="find-count"></span>
        <button id="find-prev" class="ico sm" title="Zurück"></button>
        <button id="find-next" class="ico sm" title="Weiter"></button>
        <button id="find-close" class="ico sm" title="Schließen"></button>
      </div>
    </section>

    <div id="toast" class="glass" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
