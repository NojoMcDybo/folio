<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
  </head>
  <body>
    <canvas id="glasslayer"></canvas>
    <div id="titlebar" data-tauri-drag-region></div>

    <div id="wincontrols" class="glass row">
      <button id="w-min" class="ico sm" title="Minimieren"></button>
      <button id="w-max" class="ico sm" title="Maximieren"></button>
      <button id="w-close" class="ico sm danger" title="Schließen"></button>
    </div>

    <main id="home">
      <header class="library-header"><h1>Bibliothek</h1><p>Zuletzt geöffnete Dokumente</p></header>
      <div id="grid"></div>
    </main>

    <section id="reader" hidden>
      <div id="container"><div id="viewer" class="pdfViewer"></div></div>

      <button id="b-home" class="ico glass solo" title="Bibliothek"></button>
      <button id="b-outline" class="ico glass solo drag" title="Inhaltsverzeichnis" aria-expanded="false" aria-controls="outline-panel"></button>
      <aside id="outline-panel" class="glass drag" data-glass="chapter" aria-labelledby="outline-heading" hidden>
        <header class="outline-header">
          <h2 id="outline-heading">Inhaltsverzeichnis</h2>
          <button id="outline-close" class="ico sm" title="Inhaltsverzeichnis schließen"></button>
        </header>
        <div id="outline-content">
          <p id="outline-status" role="status"></p>
          <nav id="outline-list" aria-label="PDF-Kapitel"></nav>
        </div>
      </aside>
      <button id="b-find" class="ico glass solo drag" title="Suchen · Strg+F"></button>
      <button id="b-invert" class="ico glass solo drag" title="Invertieren · Strg+I"></button>

      <!-- Einzige Bildlaufleiste: fuellt sich mit dem Lesefortschritt,
           nach einer Sekunde Verweilen wird sie zum Scrollfeld. -->
      <div id="scroller" class="glass"></div>
      <div id="scroll-target" class="glass" hidden></div>

      <div id="pagechip" class="glass"></div>
      <button id="b-save" class="ico glass solo" title="Sichern · Strg+S" hidden></button>

      <!-- Werkzeuge stehen einzeln, links und rechts vom Hauptknopf.
           Der bleibt dadurch beim Aufklappen an derselben Stelle. -->
      <div id="anngroup" class="drag">
        <button id="t-mark" class="ico glass solo side" title="Textmarker · M"></button>
        <button id="t-ink" class="ico glass solo side" title="Stift · Z"></button>
        <button id="a-toggle" class="ico glass solo" title="Anmerkungen" aria-expanded="false"></button>
        <button id="t-text" class="ico glass solo side" title="Textfeld · T"></button>
        <button id="swatch" class="glass solo side" title="Stiftfarben" aria-label="Stiftfarben" aria-expanded="false" aria-controls="color-panel"><span class="swatch-dot"></span></button>
      </div>

      <section id="color-panel" role="dialog" aria-labelledby="color-heading" hidden>
        <header><h2 id="color-heading">Meine Farben</h2><button id="color-close" aria-label="Farbauswahl schließen" title="Schließen">×</button></header>
        <div id="color-slots" role="group" aria-label="Gespeicherte Farben"></div>
        <form id="color-form">
          <label id="color-label" for="color">Farbe für Platz 1</label>
          <div class="color-edit"><input id="color" type="color" value="#ffd23f" /><input id="color-hex" aria-label="Farbwert als Hex-Code" type="text" value="#FFD23F" maxlength="7" pattern="#[a-fA-F0-9]{6}" spellcheck="false" autocomplete="off" required /></div>
          <button id="color-save" type="submit">Platz 1 speichern</button>
        </form>
        <p id="color-status" role="status">Fünf Farben, auch beim nächsten Start.</p>
      </section>

      <div id="findbar" class="glass row drag" data-glass="panel" hidden>
        <input id="find-q" type="text" aria-label="Im Dokument suchen" placeholder="Im Dokument suchen" spellcheck="false" autocomplete="off" />
        <span id="find-count"></span>
        <button id="find-prev" class="ico sm" title="Zurück"></button>
        <button id="find-next" class="ico sm" title="Weiter"></button>
      </div>

      <!-- Wird sichtbar, wenn man den Suchknopf ueber die Seite zieht. -->
      <div id="lens" class="glass" hidden><canvas id="lens-cv"></canvas></div>
    </section>

    <div id="ask" hidden>
      <div id="askbox" class="glass" role="dialog" aria-modal="true" aria-labelledby="asktext">
        <p id="asktext">Änderungen sichern?</p>
        <div class="askrow">
          <button id="ask-save">Sichern</button>
          <button id="ask-drop">Verwerfen</button>
          <button id="ask-cancel">Abbrechen</button>
        </div>
      </div>
    </div>

    <div id="toast" class="glass" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
