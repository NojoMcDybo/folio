[package]
name = "folio"
version = "0.1.0"
description = "PDF-Reader mit Markierung, Farbinvertierung und Glasoberflaeche"
authors = ["Nojo"]
edition = "2021"

[lib]
# Der Suffix `_lib` ist noetig, damit der Bibliotheksname unter Windows
# nicht mit dem Binaernamen kollidiert.
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
windows-core = "0.61.2"
