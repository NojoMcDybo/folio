[package]
name = "folio-pdfops"
version = "0.13.0"
description = "PDF-Bearbeitung fuer Folio: Drehen, Zuschneiden, Komprimieren, Graustufen, Flatten"
authors = ["Nojo"]
edition = "2021"
license = "MIT"

[dependencies]
lopdf = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
